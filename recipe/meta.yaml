package:
  name: dart-sdk
  version: {{ version }}

source:
  - url: https://github.com/dart-lang/sdk/archive/refs/tags/{{ version }}.tar.gz
    sha256: 8a6040a7998e157e4ff6ec29141a78478aac000b372a2b065a9c53ba40cf8fa9
    folder: sdk
    # 0001: upstream dart-review fix (sdk#63406) needed for GCC builds; taken
    #       from Arch's dart package.
    # 0002: keep the linux binaries self-contained (no dynamic libstdc++).
    patches:
      - patches/0001-ignore-warnings-in-binaryen.patch
      - patches/0002-link-libstdc-static-on-linux.patch
  # Prebuilt DevTools app shipped at bin/resources/devtools. Upstream fetches
  # it as a CIPD package (build_devtools_from_sources is false upstream);
  # building it from source would need the Flutter toolchain.
  - url: https://chrome-infra-packages.appspot.com/dl/dart/third_party/flutter/devtools/+/git_revision:12d595649f189f1896722623f72599077f476848  # analint: invalid_url  # CIPD endpoint answers HEAD with 405; GET works (hash verified)
    sha256: c3d92850115fdbd1ad9e462bcb2b96a36f3f518c74fdb8086b4d0d4ead8c1caa
    folder: sdk/third_party/devtools
  {% for folder, url, sha in gh_deps %}
  - url: {{ url }}
    sha256: {{ sha }}
    folder: sdk/{{ folder }}
  {% endfor %}
  {% for folder, url, sha in gh_deps_win %}
  - url: {{ url }}  # [win]
    sha256: {{ sha }}  # [win]
    folder: sdk/{{ folder }}  # [win]
  {% endfor %}
  {% for folder, url, rev in git_deps %}
  - git_url: {{ url }}
    git_rev: {{ rev }}
    folder: sdk/{{ folder }}
  {% endfor %}
  {% for folder, url, rev in git_deps_win %}
  - git_url: {{ url }}  # [win]
    git_rev: {{ rev }}  # [win]
    folder: sdk/{{ folder }}  # [win]
  {% endfor %}

build:
  number: 0
  skip: true  # [ppc64le]
  # Dart snapshots are binary blobs that must not be relocated.
  binary_relocation: false
  # System libraries the SDK binaries link against.
  missing_dso_whitelist:
    - "*/ld-linux.so.2"  # [linux]
    - "*/lib64/ld-linux-x86-64.so.2"  # [linux]
    - "*/libpthread.so.0"  # [linux]
    - "*/libdl.so.2"  # [linux]
    - "*/libm.so.6"  # [linux]
    - "*/librt.so.1"  # [linux]
    - "*/libresolv.so.2"  # [linux]
    - "*/libc.so.6"  # [linux]
    # API-set contract DLL resolved by the OS, not present in C:\Windows\System32.
    - "*/api-ms-win-core-path-l1-1-0.dll"  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    # No {{ stdlib('c') }}: the compiler packages pull the matching sysroot
    # (and anaconda-linter 0.1.1 cannot render that jinja).
    - gn
    - ninja
    - patch  # [unix]
    - git  # [not win]
    - python
    # llvm-ar/llvm-nm/llvm-strip/dsymutil for the GN mac toolchain.
    - llvm-tools  # [osx]
  host: []

# No run deps: the linux build links libstdc++ statically (recipe patch) and
# otherwise the SDK only needs the platform libc, like Google's official binaries.
  run: []

test:
  commands:
    - dart --help  # [not osx]
    - test -x "${PREFIX}/bin/dart"  # [unix]
    - if not exist "%LIBRARY_BIN%\dart.exe" exit 1  # [win]

about:
  home: https://dart.dev/
  doc_url: https://dart.dev/
  dev_url: https://github.com/dart-lang/sdk
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: a client-optimized language for developing fast apps on any platform
  description: |
    Dart is a client-optimized language for developing fast apps on any platform.
    This package builds the Dart SDK from source with gn and ninja, mirroring
    Arch Linux's dart package.

extra:
  recipe-maintainers:
    - msarahan
    - munechika-koyo
