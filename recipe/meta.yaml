{% set version = "3.13.4" %}

# The Dart SDK is built from source, mirroring Arch Linux's dart package
# (https://gitlab.archlinux.org/archlinux/packaging/packages/dart): the sdk
# tree plus the git dependencies pinned in dart-lang/sdk's DEPS file at tag
# {{ version }}, compiled with gn + ninja.
#
# dart.googlesource.com mirrors these GitHub repos at identical SHAs (per the
# DEPS header comment), so GitHub tarball URLs pin the same content. The
# test/benchmark-only deps (d8, browsers, flutter, devtools sources, webdriver,
# benchmarks-internal, emsdk, ...) are not needed by `ninja create_sdk`.

package:
  name: dart-sdk
  version: {{ version }}

source:
  - url: https://github.com/dart-lang/sdk/archive/refs/tags/{{ version }}.tar.gz
    sha256: 8a6040a7998e157e4ff6ec29141a78478aac000b372a2b065a9c53ba40cf8fa9
    folder: sdk
    # 0001: upstream dart-review fix (sdk#63406) needed for GCC builds; taken
    #       from Arch's dart package.
    # 0002: keep the linux binaries self-contained (no dynamic libstdc++).
    patches:
      - patches/0001-ignore-warnings-in-binaryen.patch  # [not win]
      - patches/0002-link-libstdc-static-on-linux.patch  # [linux]
  # Prebuilt DevTools app shipped at bin/resources/devtools. Upstream fetches
  # it as a CIPD package (build_devtools_from_sources is false upstream);
  # building it from source would need the Flutter toolchain. The explicit fn
  # avoids the "git_revision:" cache filename, which is illegal on Windows.
  - url: https://chrome-infra-packages.appspot.com/dl/dart/third_party/flutter/devtools/+/git_revision:12d595649f189f1896722623f72599077f476848  # analint: invalid_url  # CIPD endpoint answers HEAD with 405; GET works (hash verified)
    fn: devtools-12d595649f189f1896722623f72599077f476848.zip
    sha256: c3d92850115fdbd1ad9e462bcb2b96a36f3f518c74fdb8086b4d0d4ead8c1caa
    folder: sdk/third_party/devtools
  # gclient normally fetches a prebuilt Dart SDK into tools/sdks/dart-sdk to
  # bootstrap kernel compilation (bootstrap_compile_platform); ship the
  # official release zip instead. macOS 13 workers cannot run a 3.11+ VM
  # (minos 14.0), so the mac bootstrap is 3.10.x.
